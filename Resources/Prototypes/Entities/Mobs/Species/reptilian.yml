- type: entity
  save: false
  name: Urisst' Mzhand
  parent: BaseMobSpeciesOrganic
  id: BaseMobReptilian
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Reptilian
    hideLayersOnEquip:
    - Snout
    - HeadTop
    - HeadSide
    undergarmentBottom: UndergarmentBottomBoxersReptilian
  - type: Hunger
  - type: Puller
    needsHands: false
    # ADT start
    grabStats:
      None:
        requiredHands: 0
        doaftersToEscape: 0
        movementSpeedModifier: 0.95
        escapeAttemptTime: 0
        setStageTime: 0
      Soft:
        requiredHands: 0
        doaftersToEscape: 1
        movementSpeedModifier: 0.9
        escapeAttemptTime: 1
        setStageTime: 0
      Hard:
        requiredHands: 1
        doaftersToEscape: 2
        movementSpeedModifier: 0.85
        escapeAttemptTime: 1.5
        setStageTime: 0.75
      Choke:
        requiredHands: 2
        doaftersToEscape: 2
        movementSpeedModifier: 0.8
        escapeAttemptTime: 1.75
        setStageTime: 1.25
    # ADT end
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Reptilian/parts.rsi
    state: full
  - type: Body
    prototype: Reptilian
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Thump', 'ReptilianHiss'] # Imp: add ReptilianHiss
  - type: TypingIndicator
    proto: lizard
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Scale
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Temperature
    heatDamageThreshold: 400
    coldDamageThreshold: 285
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage:
      types:
        Cold : 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat : 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      301: 0.8
      295: 0.6
      285: 0.4
  - type: Wagging
  - type: Inventory
    speciesId: reptilian
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Carriable # Frontier: Carrying system from nyanotrasen.
  - type: ShortWhitelist # Frontier
    scale: 0.8 # Frontier
    density: 140 # Frontier
    pseudoItem: true # Frontier
    cosmeticOnly: false # Frontier
  - type: TallWhitelist # Frontier
    scale: 1.2 # Frontier

- type: entity
  parent: BaseSpeciesDummy
  id: MobReptilianDummy
  categories: [ HideSpawnMenu ]
  description: A dummy reptilian meant to be used in character setup.
  components:
  - type: HumanoidAppearance
    species: Reptilian
    hideLayersOnEquip:
    - Snout
    - HeadTop
    - HeadSide
    undergarmentBottom: UndergarmentBottomBoxersReptilian
  - type: Inventory
    speciesId: reptilian
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female

